
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Soal AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>GENERATE SOAL AI</h1>
        <p>Aplikasi Penyusunan Kisi-Kisi dan Soal Otomatis</p>
    </header>

    <main class="container">

        <section class="card">
            <h2>Identitas Sekolah</h2>

            <label>Nama Sekolah</label>
            <input type="text" id="sekolah" placeholder="Nama sekolah">

            <label>Nama Guru</label>
            <input type="text" id="guru" placeholder="Nama guru">

            <label>Mata Pelajaran</label>
            <input type="text" id="mapel" placeholder="Mata pelajaran">

            <label>Kelas</label>
            <select id="kelas">
                <option value="">Pilih Kelas</option>
                <option>Kelas I</option>
                <option>Kelas II</option>
                <option>Kelas III</option>
                <option>Kelas IV</option>
                <option>Kelas V</option>
                <option>Kelas VI</option>
            </select>
        </section>

        <section class="card">
            <h2>Pengaturan Soal</h2>

            <label>Materi</label>
            <textarea id="materi" placeholder="Masukkan materi pembelajaran"></textarea>

            <label>Jumlah Soal</label>
            <input type="number" id="jumlah" min="1" value="10">

            <label>Bentuk Soal</label>
            <select id="bentuk">
                <option>Pilihan Ganda</option>
                <option>Isian</option>
                <option>Uraian</option>
            </select>

            <button onclick="generateSoal()">Generate Soal</button>
        </section>

        <section class="card">
            <h2>Hasil Generate</h2>
            <div id="hasil">
                Hasil soal akan ditampilkan di sini.
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
